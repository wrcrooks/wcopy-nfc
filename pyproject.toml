[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcopy-nfc"
version = "0.1.0"
description = "Reverse-engineered Python driver for the wCopy Smart Reader USB NFC reader/writer (USB ID 0416:b030) and compatible devices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
